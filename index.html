<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#165c38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Badminton Club Full Option</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="dist/tailwind.offline.css">
</head>
<body class="bg-stone-100 text-slate-900 antialiased">
  <div id="app-shell" class="min-h-screen">
    <header class="app-header sticky top-0 z-30 bg-white border-b border-slate-200">
      <div class="header-inner flex items-center gap-3 px-4 py-3">
        <div class="brand-mark shrink-0">B</div>
        <div class="min-w-0">
          <div class="text-sm font-bold leading-tight">Badminton Club</div>
          <div class="text-xs text-slate-500 truncate">Offline-first court manager</div>
        </div>

        <nav class="view-tabs ml-auto flex items-center rounded-lg border border-slate-200 bg-stone-50 p-1" aria-label="View switch">
          <button class="view-tab active" data-view="admin">Admin</button>
          <button class="view-tab" data-view="player">Player</button>
        </nav>

        <button id="cloud-button" class="network-chip" data-action="cloud-account" type="button" hidden style="display:none"><span id="cloud-label">Cloud</span></button>

        <button id="network-button" class="network-chip" data-action="open-offline" type="button" hidden style="display:none">
          <span id="network-dot" class="network-dot"></span>
          <span id="network-label">กำลังโหลด</span>
        </button>
      </div>
    </header>

    <main id="admin-root" class="view-root"></main>
    <main id="player-root" class="view-root hidden"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="assets/js/app.js?v=20260828-1"></script>
</body>
</html>
